<!-- index.html (Logowanie) -->
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090014">
    <title>Wejście - Nasza Przestrzeń</title>
    <!-- Czcionki: <link> zamiast @import w CSS = szybsze ładowanie -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Pacifico&display=swap">
    <link rel="stylesheet" href="style.css">
    <!-- Styl tylko dla telefonów (na komputerze jest pomijany) -->
    <link rel="stylesheet" href="mobile.css" media="(max-width: 768px), (max-height: 500px) and (pointer: coarse)">
    <!-- Podczas wpisywania hasła przeglądarka już pobiera stronę główną -->
    <link rel="prefetch" href="main.html">
    <link rel="prefetch" href="main.js">
</head>
<body>
    <div id="login-screen" class="screen">
        <div class="neon-box">
            <h1 class="neon-text">Dostęp chroniony</h1>
            <input type="password" id="password-input" placeholder="Wprowadź datę..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
            <div class="login-actions">
                <button id="login-btn">Wejdź</button>
                <button id="hint-btn" class="btn-subtle">Podpowiedź</button>
            </div>
            <p id="hint-text" class="hint hidden">Dzień, w którym wszystko się zmieniło (RRRR-MM-DD)</p>
            <p id="error-msg" class="hidden">To nie ten dzień...</p>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
